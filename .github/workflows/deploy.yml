name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      enable_indexing:
        description: 'Enable indexing (remove noindex)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: v2

      - name: Create production .env
        working-directory: v2
        run: |
          echo "PUBLIC_GA_MEASUREMENT_ID=G-J4DZPPT47Y" > .env
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.enable_indexing }}" = "false" ]; then
              echo "PUBLIC_STAGING=true" >> .env
            fi
          fi

      - name: Set production base
        working-directory: v2
        run: |
          sed -i "s|base: '/v2'|base: '/'|" astro.config.mjs

      - name: Build Astro
        run: npm run build
        working-directory: v2

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./v2/dist
          publish_branch: master
          keep_files: true
          enable_jekyll: true
